name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ビルドは JDK 25 で起動し、1.21.11 用の JDK 21 は Gradle toolchain (foojay) が取得する
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Gradle and loom
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
            .gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'stonecutter.properties.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 全対応バージョン (stonecutter サブプロジェクト) をビルド + テスト
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build

      - uses: actions/upload-artifact@v7
        with:
          name: build-libs
          path: versions/*/build/libs
