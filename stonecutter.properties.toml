# バージョン共通/バージョン別のプロパティ。
# See https://stonecutter.kikugie.dev/wiki/config/properties#centralized-properties
mod.version = "0.4.2"
mod.file_name = "rawmats-fabric"

deps.fabric_loader = "0.19.3"
loomx.loom_version = "1.17-SNAPSHOT"

# deps.* (コンパイル用) は宣言 floor (*_compat の下限) と同じ版にする。floor の版で実際にビルド・起動を
# 確かめるため。依存は Modrinth maven から取る (masa maven は古い版を消すので使わない。build.gradle.kts 参照)。
# litematica の floor はセキュリティ下限を兼ねる:
# 2026-07 の RCE advisory (コマンド実行脆弱性) の修正版 = 1.21.11: 0.26.11 / 26.1.x: 0.27.9 / 26.2: 0.28.3。
# これ未満に floor を下げないこと (Modrinth でもこれ未満の版は消えている)。
# malilib の floor は、その litematica の floor が要求する malilib 以上にする (26.2 は 0.29.2)。

["1.21.11"]
mod.mc_compat = "1.21.11"
mod.malilib_compat = ">=0.27.16"
mod.litematica_compat = ">=0.26.11"
deps.malilib = "0.27.16"
deps.litematica = "0.26.11"
# malilib 0.27.16 の同梱 jar と同じ版 (build.gradle.kts の deps.dev_runtime のコメント参照)
deps.dev_runtime = "net.fabricmc.fabric-api:fabric-api-base:1.0.5+4ebb5c083e, net.fabricmc.fabric-api:fabric-networking-api-v1:5.1.6+6b6d71a53e, net.fabricmc.fabric-api:fabric-resource-loader-v1:1.0.10+78c8b4663e, me.fallenbreath:conditional-mixin-fabric:0.6.4"

["26.1.x"]
mod.mc_compat = "~26.1"
mod.malilib_compat = ">=0.28.9 <0.29"
mod.litematica_compat = ">=0.27.9"
deps.malilib = "0.28.9"
deps.litematica = "0.27.9"

["26.2.x"]
mod.mc_compat = "~26.2"
mod.malilib_compat = ">=0.29.2 <0.30"
mod.litematica_compat = ">=0.28.3"
deps.malilib = "0.29.2"
deps.litematica = "0.28.3"

["26.3.x"]
mod.mc_compat = "~26.3"
mod.malilib_compat = ">=0.30.2 <0.31"
mod.litematica_compat = ">=0.29.1"
deps.malilib = "0.30.2"
deps.litematica = "0.29.1"
